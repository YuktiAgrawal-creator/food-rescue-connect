services:
  - type: web
    name: food-rescue-backend
    env: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "bash ./start.sh"
    healthCheckPath: "/health/"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: food-rescue-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "food-rescue-connect.onrender.com,localhost,127.0.0.1,*"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://food-rescue-connect-indol.vercel.app,https://food-rescue-connect-yuktiagrawal22-3197s-projects.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://food-rescue-connect-indol.vercel.app,https://food-rescue-connect-yuktiagrawal22-3197s-projects.vercel.app,https://*.vercel.app,https://food-rescue-connect.onrender.com"

databases:
  - name: food-rescue-db
    plan: free
    databaseName: food_rescue
    user: food_rescue_user
