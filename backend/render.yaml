services:
  - type: web
    name: food-rescue-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: food-rescue-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://food-rescue-connect-indol.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://food-rescue-connect-indol.vercel.app"

databases:
  - name: food-rescue-db
    plan: free
    databaseName: food_rescue
    user: food_rescue_user
